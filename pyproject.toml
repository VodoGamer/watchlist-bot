[project]
name = "watchlist-bot"
version = "0.2.0-beta.2"
description = "Together watchlist solution for Telegram"
readme = "README.md"
authors = [
    { name = "VodoGamer", email = "vodoplayyt1@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "telegrinder>=1.1.3",
]

[project.scripts]
watchlist-bot = "watchlist_bot:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "basedpyright>=1.39.9",
    "ruff>=0.16.2",
]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"

[tool.ruff]
line-length = 99

