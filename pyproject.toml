[project]
name = "watchlist-bot"
version = "0.1.0"
description = "Together watchlist solution for Telegram"
readme = "README.md"
authors = [
    { name = "VodoGamer", email = "vodoplayyt1@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.19.1",
    "python-dotenv>=1.2.2",
    "sqlalchemy>=2.0.51",
    "telegrinder>=1.1.3",
]

[project.scripts]
watchlist-bot = "watchlist_bot:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

